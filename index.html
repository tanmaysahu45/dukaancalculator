<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shop Smart Calc</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <style>
    :root {
      --primary: #2563eb;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #22c55e;
      --danger: #ef4444;
      --border: #334155;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
    html, body { width: 100%; overflow-x: hidden; background: var(--bg); color: var(--text-main); }
    body { padding: 8px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 10px; }

    /* Header */
    .header { display: flex; justify-content: space-between; align-items: center; padding: 4px 2px; }
    .header h2 { font-size: 18px; font-weight: 800; color: #fff; }
    .install-btn { background: #eab308; color: #000; border: none; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 900; cursor: pointer; display: none; }

    /* Card */
    .card { background: var(--card-bg); border-radius: 12px; padding: 12px; border: 1px solid var(--border); width: 100%; }

    /* Item Selector */
    .items-scroll { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
    .item-pill { background: #334155; color: var(--text-main); border: 2px solid transparent; padding: 6px 12px; border-radius: 20px; font-weight: 700; font-size: 13px; white-space: nowrap; cursor: pointer; }
    .item-pill.active { background: var(--primary); border-color: #60a5fa; color: #fff; }

    /* Active Item Banner */
    .active-banner { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .active-banner .name { font-size: 18px; font-weight: 800; color: #38bdf8; }
    .active-banner .rate { font-size: 13px; font-weight: bold; color: var(--accent); }

    /* 2-Way Sync Box */
    .calc-box { background: #0b1329; border: 2px solid #3b82f6; border-radius: 12px; padding: 10px; }
    .calc-title { text-align: center; font-size: 11px; color: var(--text-muted); margin-bottom: 8px; font-weight: bold; text-transform: uppercase; }
    .sync-row { display: flex; gap: 6px; align-items: center; }
    .input-wrap { flex: 1; min-width: 0; }
    .input-wrap label { font-size: 11px; font-weight: bold; color: var(--text-muted); display: block; margin-bottom: 2px; }
    .input-wrap input { background: #1e293b; border: 2px solid var(--border); border-radius: 8px; color: #fff; font-size: 18px; font-weight: bold; padding: 10px 4px; width: 100%; text-align: center; outline: none; }
    .input-wrap input:focus { border-color: var(--primary); }
    .sync-icon { font-size: 18px; color: #60a5fa; font-weight: bold; margin-top: 14px; }

    /* Chips */
    .chip-group { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; justify-content: center; }
    .chip { background: #1e293b; border: 1px solid var(--border); border-radius: 15px; padding: 4px 8px; font-size: 12px; font-weight: bold; color: #f1f5f9; cursor: pointer; }

    /* Quick Grid */
    .rate-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
    .grid-box { background: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 6px 2px; text-align: center; cursor: pointer; }
    .grid-box span { font-size: 11px; color: var(--text-muted); display: block; }
    .grid-box strong { font-size: 14px; color: var(--accent); }

    /* Management Section */
    .manage-head h4 { font-size: 14px; color: var(--text-muted); margin-bottom: 8px; }
    .btn { background: var(--primary); color: #fff; border: none; padding: 8px 10px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-danger { background: var(--danger); }
    .btn-sm { padding: 4px 8px; font-size: 11px; }
    
    .form-col { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
    .form-inputs { display: flex; gap: 6px; }
    .form-inputs input { background: #0f172a; border: 1px solid var(--border); color: #fff; padding: 8px; border-radius: 6px; font-size: 13px; outline: none; width: 50%; min-width: 0; }
    
    .item-list-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  </style>
</head>
<body>

<div class="container">
  
  <div class="header">
    <h2>⚡ Shop Rate Calc</h2>
    <button id="installAppBtn" class="install-btn" onclick="installApp()">📲 Install App</button>
  </div>

  <div class="card" style="padding: 8px;">
    <div class="items-scroll" id="itemPills"></div>
  </div>

  <div class="card">
    <div class="active-banner">
      <div class="name" id="selectedName">Paneer</div>
      <div class="rate" id="selectedRate">₹0 / 100g</div>
    </div>

    <div class="calc-box">
      <div class="calc-title">Instant 2-Way Sync</div>
      <div class="sync-row">
        <div class="input-wrap">
          <label>Rupees (₹)</label>
          <input type="number" id="inputRupees" placeholder="0" oninput="handleRupeesChange()">
        </div>
        <div class="sync-icon">⇄</div>
        <div class="input-wrap">
          <label>Weight (Gram)</label>
          <input type="number" id="inputGrams" placeholder="0" oninput="handleGramsChange()">
        </div>
      </div>

      <div class="chip-group">
        <div class="chip" onclick="setRupees(20)">₹20</div>
        <div class="chip" onclick="setRupees(50)">₹50</div>
        <div class="chip" onclick="setRupees(100)">₹100</div>
        <div class="chip" onclick="setRupees(200)">₹200</div>
        <div class="chip" onclick="setRupees(250)">₹250</div>
      </div>
      <div class="chip-group" style="margin-top: 4px;">
        <div class="chip" onclick="setGrams(100)">100g</div>
        <div class="chip" onclick="setGrams(200)">200g</div>
        <div class="chip" onclick="setGrams(250)">250g</div>
        <div class="chip" onclick="setGrams(500)">500g</div>
        <div class="chip" onclick="setGrams(1000)">1kg</div>
      </div>
    </div>

    <div class="rate-grid">
      <div class="grid-box" onclick="setGrams(50)"><span>50 Gram</span><strong id="q50">₹0</strong></div>
      <div class="grid-box" onclick="setGrams(100)"><span>100 Gram</span><strong id="q100">₹0</strong></div>
      <div class="grid-box" onclick="setGrams(200)"><span>200 Gram</span><strong id="q200">₹0</strong></div>
      <div class="grid-box" onclick="setGrams(250)"><span>250 Gram</span><strong id="q250">₹0</strong></div>
      <div class="grid-box" onclick="setGrams(500)"><span>500 Gram</span><strong id="q500">₹0</strong></div>
      <div class="grid-box" onclick="setGrams(1000)"><span>1 Kg</span><strong id="q1000">₹0</strong></div>
    </div>
  </div>

  <div class="card">
    <div class="manage-head">
      <h4>Manage Items & Rates</h4>
    </div>
    
    <div class="form-col">
      <div class="form-inputs">
        <input type="text" id="itemNameInput" placeholder="Name (e.g. Khoya)">
        <input type="number" id="itemRateInput" placeholder="Rate/100g (₹)">
      </div>
      <button class="btn" onclick="saveItem()" style="width: 100%;">Save Item</button>
    </div>

    <div id="itemsContainer"></div>
  </div>

</div>

<script>
  let items = [
    { name: 'Paneer', rate100g: 36 },
    { name: 'Khoya / Mawa', rate100g: 32 },
    { name: 'Rasgulla', rate100g: 24 }
  ];
  let activeIndex = 0;

  function init() {
    const saved = localStorage.getItem('shop_items_v2');
    if (saved) {
      items = JSON.parse(saved);
    } else {
      saveData();
    }
    renderTabs();
    updateView();
  }

  function saveData() {
    localStorage.setItem('shop_items_v2', JSON.stringify(items));
  }

  function renderTabs() {
    const pills = document.getElementById('itemPills');
    const list = document.getElementById('itemsContainer');
    pills.innerHTML = '';
    list.innerHTML = '';

    if (activeIndex >= items.length) activeIndex = 0;

    items.forEach((item, index) => {
      const pill = document.createElement('div');
      pill.className = `item-pill ${index === activeIndex ? 'active' : ''}`;
      pill.innerText = item.name;
      pill.onclick = () => { activeIndex = index; renderTabs(); updateView(); };
      pills.appendChild(pill);

      const row = document.createElement('div');
      row.className = 'item-list-row';
      row.innerHTML = `
        <div><strong>${item.name}</strong> <span style="color:var(--text-muted);">(₹${item.rate100g}/100g)</span></div>
        <div style="display:flex; gap:4px;">
          <button class="btn btn-sm" onclick="editItem(${index})">Edit</button>
          <button class="btn btn-sm btn-danger" onclick="deleteItem(${index})">Del</button>
        </div>
      `;
      list.appendChild(row);
    });
  }

  function updateView() {
    const current = items[activeIndex];
    if (!current) return;

    document.getElementById('selectedName').innerText = current.name;
    document.getElementById('selectedRate').innerText = `₹${current.rate100g} / 100g (₹${current.rate100g * 10}/kg)`;

    const r = current.rate100g;
    document.getElementById('q50').innerText = `₹${(r * 0.5).toFixed(1)}`;
    document.getElementById('q100').innerText = `₹${r}`;
    document.getElementById('q200').innerText = `₹${(r * 2).toFixed(1)}`;
    document.getElementById('q250').innerText = `₹${(r * 2.5).toFixed(1)}`;
    document.getElementById('q500').innerText = `₹${(r * 5).toFixed(1)}`;
    document.getElementById('q1000').innerText = `₹${(r * 10).toFixed(1)}`;

    const rsVal = document.getElementById('inputRupees').value;
    if (rsVal) handleRupeesChange();
    else handleGramsChange();
  }

  function handleRupeesChange() {
    const current = items[activeIndex];
    const rs = parseFloat(document.getElementById('inputRupees').value);
    if (current && !isNaN(rs) && rs > 0) {
      const grams = (rs / current.rate100g) * 100;
      document.getElementById('inputGrams').value = grams % 1 === 0 ? grams : grams.toFixed(1);
    } else if (isNaN(rs) || rs === 0) {
      document.getElementById('inputGrams').value = '';
    }
  }

  function handleGramsChange() {
    const current = items[activeIndex];
    const grams = parseFloat(document.getElementById('inputGrams').value);
    if (current && !isNaN(grams) && grams > 0) {
      const rs = (grams / 100) * current.rate100g;
      document.getElementById('inputRupees').value = rs % 1 === 0 ? rs : rs.toFixed(2);
    } else if (isNaN(grams) || grams === 0) {
      document.getElementById('inputRupees').value = '';
    }
  }

  function setRupees(val) {
    document.getElementById('inputRupees').value = val;
    handleRupeesChange();
  }

  function setGrams(val) {
    document.getElementById('inputGrams').value = val;
    handleGramsChange();
  }

  function saveItem() {
    const name = document.getElementById('itemNameInput').value.trim();
    const rate = parseFloat(document.getElementById('itemRateInput').value);

    if (!name || isNaN(rate) || rate <= 0) return alert('Enter valid name and rate for 100g');

    const exist = items.findIndex(i => i.name.toLowerCase() === name.toLowerCase());
    if (exist >= 0) {
      items[exist].rate100g = rate;
      activeIndex = exist;
    } else {
      items.push({ name, rate100g: rate });
      activeIndex = items.length - 1;
    }

    saveData();
    renderTabs();
    updateView();
    document.getElementById('itemNameInput').value = '';
    document.getElementById('itemRateInput').value = '';
  }

  function editItem(index) {
    document.getElementById('itemNameInput').value = items[index].name;
    document.getElementById('itemRateInput').value = items[index].rate100g;
  }

  function deleteItem(index) {
    if (confirm(`Delete "${items[index].name}"?`)) {
      items.splice(index, 1);
      saveData();
      renderTabs();
      updateView();
    }
  }

  // --- Real PWA Install Button System ---
  let deferredPrompt;
  const installBtn = document.getElementById('installAppBtn');

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = 'block';
  });

  function installApp() {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then((choiceResult) => {
        if (choiceResult.outcome === 'accepted') {
          installBtn.style.display = 'none';
        }
        deferredPrompt = null;
      });
    }
  }

  // Service Worker Registration
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(() => console.log('Offline Service Worker Ready!'))
        .catch((err) => console.log('SW Error:', err));
    });
  }

  init();
</script>
</body>
</html>
